<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket League</title>

    <!-- Fuente Orbitron -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #000000;
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            padding: 0;
            color: white;
        }

        .bienvenida {
            background: linear-gradient(90deg, #0a6cff, #FF6A00);
            width: 80%;
            margin: 40px auto;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.7);
        }

        .imagen-titulo {
            width: 100%;
            max-width: 600px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 0 20px #0A1AFF;
        }

        h1 {
            font-size: 45px;
            margin-bottom: 20px;
            color: white;
            text-shadow: 0 0 10px #0A1AFF, 0 0 20px #FF6A00;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    
<section class="bienvenida">

    <!-- TITULO -->
    <h1>Rocket League</h1>

    <!-- TEXTO -->
    <p>
        Rocket League es un juego que combina fútbol con autos impulsados por cohetes.
        Los jugadores controlan vehículos para golpear una pelota gigante e intentar
        marcar goles en el arco rival, utilizando saltos, acrobacias y turbo.
    </p>
</section>
    
</body>
</html>
